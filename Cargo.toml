[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[workspace.dependencies]
rean_core = { path = "crates/rean_core" }
rean_lexer = { path = "crates/rean_lexer" }
rean_syntax = { path = "crates/rean_syntax" }
rean_kernel = { path = "crates/rean_kernel" }
rean_export = { path = "crates/rean_export" }
rean_eval = { path = "crates/rean_eval" }
serde_json = "1"
mimalloc = "0.1"

[workspace.lints.clippy]
all = "warn"
